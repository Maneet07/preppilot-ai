[alembic]
# General configuration
script_location = ./alembic
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = sqlalchemy.engine, sqlalchemy.dialects, sqlalchemy.schema, sqlalchemy.runtime, sqlalchemy.util

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
level = INFO

[incremental_step]
headroom = 100

[timezone]
default = UTC